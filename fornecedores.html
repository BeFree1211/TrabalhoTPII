<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giro – Fornecedores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="marca">
            <img class="logo" src="img/logo.svg" alt="" width="52" height="52">
            <div class="marca-texto">
                <h1>Giro</h1>
                <p class="subtitulo">Controle de Estoque</p>
            </div>
        </div>
    </header>
    <menutpi2>
    <nav aria-label="Menu principal">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="fornecedores.html" aria-current="page">Fornecedores</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="movimentacoes.html">Movimentações</a></li>
        </ul>
    </nav>
    </menutpi2>
    <main>
        <div class="card">
            <h2>Cadastro de fornecedor</h2>
            <form id="form-fornecedor" data-endpoint="php/fornecedor.php" novalidate>
                <tpi2></tpi2>
                <label for="razao_social">Razão social</label>
                <input type="text" id="razao_social" name="razao_social" required>
                <div class="erro" data-erro="razao_social"></div>

                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" required>
                <div class="erro" data-erro="cnpj"></div>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
                <div class="erro" data-erro="email"></div>

                <label for="telefone">Telefone (com DDD)</label>
                <input type="text" id="telefone" name="telefone" required>
                <div class="erro" data-erro="telefone"></div>

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" required>
                <div class="erro" data-erro="cidade"></div>

                <label for="uf">UF</label>
                <input type="text" id="uf" name="uf" maxlength="2" required>
                <div class="erro" data-erro="uf"></div>

                <button type="submit">Cadastrar fornecedor</button>
            </form>
            <div id="resultado" class="resultado" role="status"></div>
        </div>
        <a class="voltar" href="index.html">← Voltar à página inicial</a>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
