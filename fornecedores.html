<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giro – Fornecedores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="marca">
            <img class="logo" src="img/logo.svg" alt="" width="52" height="52">
            <div class="marca-texto">
                <h1>Giro</h1>
                <p class="subtitulo">Controle de Estoque</p>
            </div>
        </div>
        <div class="usuario-logado">
            Olá, <strong id="nome-usuario"></strong>
            <a href="php/logout.php">Sair</a>
        </div>
    </header>
    <nav aria-label="Menu principal">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="fornecedores.html" aria-current="page">Fornecedores</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="movimentacoes.html">Movimentações</a></li>
            <li><a href="usuarios.html">Usuários</a></li>
        </ul>
    </nav>
    <main>
        <div class="card">
            <h2>Cadastro de fornecedor</h2>
            <form id="form-fornecedor" data-endpoint="php/fornecedor.php" novalidate>
                <input type="hidden" id="id" name="id">

                <label for="razao_social">Razão social</label>
                <input type="text" id="razao_social" name="razao_social" required>
                <div class="erro" data-erro="razao_social"></div>

                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" required>
                <div class="erro" data-erro="cnpj"></div>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
                <div class="erro" data-erro="email"></div>

                <label for="telefone">Telefone (com DDD)</label>
                <input type="text" id="telefone" name="telefone" required>
                <div class="erro" data-erro="telefone"></div>

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" required>
                <div class="erro" data-erro="cidade"></div>

                <label for="uf">UF</label>
                <input type="text" id="uf" name="uf" maxlength="2" required>
                <div class="erro" data-erro="uf"></div>

                <button type="submit">Salvar fornecedor</button>
                <button type="button" id="limpar" class="secundario">Limpar formulário</button>
            </form>
            <div id="resultado" class="resultado" role="status"></div>
        </div>
        <div class="card">
            <h2>Fornecedores cadastrados</h2>
            <div class="rolagem">
                <table class="lista">
                    <thead><tr><th>Razão social</th><th>CNPJ</th><th>Telefone</th><th>Cidade</th><th>Prazo</th><th></th></tr></thead>
                    <tbody id="corpo-tabela"></tbody>
                </table>
            </div>
        </div>
        <a class="voltar" href="index.html">← Voltar à página inicial</a>
    </main>
    <footer>Tecnologias para Internet II – Trabalho Momento II</footer>
    <script src="js/app.js"></script>
    <script src="js/fornecedores.js"></script>
</body>
</html>
