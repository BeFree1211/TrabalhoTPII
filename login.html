<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giro – Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="pagina-login">
    <header>
        <div class="marca">
            <img class="logo" src="img/logo.svg" alt="" width="52" height="52">
            <div class="marca-texto">
                <h1>Giro</h1>
                <p class="subtitulo">Controle de Estoque</p>
            </div>
        </div>
    </header>
    <main class="estreito">
        <div class="card">
            <h2>Entrar no sistema</h2>
            <form id="form-login" data-endpoint="php/login.php" novalidate>
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
                <div class="erro" data-erro="email"></div>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
                <div class="erro" data-erro="senha"></div>

                <button type="submit">Entrar</button>
            </form>
            <div id="resultado" class="resultado" role="status"></div>
        </div>
    </main>
    <footer>Tecnologias para Internet II – Trabalho Momento II</footer>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
