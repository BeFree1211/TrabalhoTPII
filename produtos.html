<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estoque Fácil – Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header><h1>Estoque Fácil – Controle de Estoque</h1></header>
    <menutpi2>
    <nav aria-label="Menu principal">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="produtos.html" aria-current="page">Produtos</a></li>
            <li><a href="fornecedores.html">Fornecedores</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="movimentacoes.html">Movimentações</a></li>
        </ul>
    </nav>
    </menutpi2>
    <main>
        <div class="card">
            <h2>Cadastro de produto</h2>
            <form id="form-produto" data-endpoint="php/produto.php" novalidate>
                <tpi2></tpi2>
                <label for="nome">Nome do produto</label>
                <input type="text" id="nome" name="nome" required>
                <div class="erro" data-erro="nome"></div>

                <label for="sku">SKU (ex.: ELE-0001)</label>
                <input type="text" id="sku" name="sku" required>
                <div class="erro" data-erro="sku"></div>

                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecione…</option>
                    <option>Eletrônicos</option>
                    <option>Alimentos</option>
                    <option>Vestuário</option>
                    <option>Papelaria</option>
                    <option>Limpeza</option>
                </select>
                <div class="erro" data-erro="categoria"></div>

                <label for="fornecedor">Fornecedor</label>
                <input type="text" id="fornecedor" name="fornecedor" required>
                <div class="erro" data-erro="fornecedor"></div>

                <label for="preco_custo">Preço de custo (R$)</label>
                <input type="text" id="preco_custo" name="preco_custo" inputmode="decimal" required>
                <div class="erro" data-erro="preco_custo"></div>

                <label for="preco_venda">Preço de venda (R$)</label>
                <input type="text" id="preco_venda" name="preco_venda" inputmode="decimal" required>
                <div class="erro" data-erro="preco_venda"></div>

                <label for="estoque_minimo">Estoque mínimo</label>
                <input type="text" id="estoque_minimo" name="estoque_minimo" inputmode="numeric" required>
                <div class="erro" data-erro="estoque_minimo"></div>

                <button type="submit">Cadastrar produto</button>
            </form>
            <div id="resultado" class="resultado" role="status"></div>
        </div>
        <a class="voltar" href="index.html">← Voltar à página inicial</a>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
