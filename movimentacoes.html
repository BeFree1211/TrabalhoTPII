<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giro – Movimentações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="marca">
            <img class="logo" src="img/logo.svg" alt="" width="52" height="52">
            <div class="marca-texto">
                <h1>Giro</h1>
                <p class="subtitulo">Controle de Estoque</p>
            </div>
        </div>
    </header>
    <menutpi2>
    <nav aria-label="Menu principal">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="fornecedores.html">Fornecedores</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="movimentacoes.html" aria-current="page">Movimentações</a></li>
        </ul>
    </nav>
    </menutpi2>
    <main>
        <div class="card">
            <h2>Movimentação de estoque</h2>
            <form id="form-movimentacao" data-endpoint="php/movimentacao.php" novalidate>
                <tpi2></tpi2>
                <label for="sku">SKU do produto</label>
                <input type="text" id="sku" name="sku" placeholder="ELE-0001" required>
                <div class="erro" data-erro="sku"></div>

                <label for="tipo">Tipo</label>
                <select id="tipo" name="tipo" required>
                    <option value="">Selecione…</option>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                    <option value="ajuste">Ajuste</option>
                </select>
                <div class="erro" data-erro="tipo"></div>

                <label for="quantidade">Quantidade</label>
                <input type="text" id="quantidade" name="quantidade" inputmode="numeric" required>
                <div class="erro" data-erro="quantidade"></div>

                <label for="data_movimentacao">Data</label>
                <input type="date" id="data_movimentacao" name="data_movimentacao" required>
                <div class="erro" data-erro="data_movimentacao"></div>

                <label for="responsavel">Responsável</label>
                <input type="text" id="responsavel" name="responsavel" required>
                <div class="erro" data-erro="responsavel"></div>

                <label for="observacao">Observação (obrigatória para saída e ajuste)</label>
                <textarea id="observacao" name="observacao" rows="3"></textarea>
                <div class="erro" data-erro="observacao"></div>

                <button type="submit">Registrar movimentação</button>
            </form>
            <div id="resultado" class="resultado" role="status"></div>
        </div>
        <a class="voltar" href="index.html">← Voltar à página inicial</a>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
