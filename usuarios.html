<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giro – Usuários</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="marca">
            <img class="logo" src="img/logo.svg" alt="" width="52" height="52">
            <div class="marca-texto">
                <h1>Giro</h1>
                <p class="subtitulo">Controle de Estoque</p>
            </div>
        </div>
        <div class="usuario-logado">
            Olá, <strong id="nome-usuario"></strong>
            <a href="php/logout.php">Sair</a>
        </div>
    </header>
    <nav aria-label="Menu principal">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="fornecedores.html">Fornecedores</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="movimentacoes.html">Movimentações</a></li>
            <li><a href="usuarios.html" aria-current="page">Usuários</a></li>
        </ul>
    </nav>
    <main>
        <div class="card">
            <h2>Cadastro de usuário</h2>
            <form id="form-usuario" data-endpoint="php/usuario.php" novalidate>
                <input type="hidden" id="id" name="id">

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
                <div class="erro" data-erro="nome"></div>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
                <div class="erro" data-erro="email"></div>

                <label for="senha">Senha (para alterar um usuário, deixe em branco se não quiser trocar)</label>
                <input type="password" id="senha" name="senha">
                <div class="erro" data-erro="senha"></div>

                <button type="submit">Salvar usuário</button>
                <button type="button" id="limpar" class="secundario">Limpar formulário</button>
            </form>
            <div id="resultado" class="resultado" role="status"></div>
        </div>
        <div class="card">
            <h2>Usuários do sistema</h2>
            <div class="rolagem">
                <table class="lista">
                    <thead><tr><th>Nome</th><th>E-mail</th><th></th></tr></thead>
                    <tbody id="corpo-tabela"></tbody>
                </table>
            </div>
        </div>
        <a class="voltar" href="index.html">← Voltar à página inicial</a>
    </main>
    <footer>Tecnologias para Internet II – Trabalho Momento II</footer>
    <script src="js/app.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
