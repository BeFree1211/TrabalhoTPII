<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Giro">
    <!-- Anel aberto: representa o giro (rotatividade) do estoque -->
    <path d="M 35.49 14.36 A 15 15 0 1 1 18.87 9.90"
          fill="none" stroke="#edbccf" stroke-width="3.4" stroke-linecap="round"/>
    <!-- Ponta da seta, fechando o movimento circular -->
    <polygon points="23.85,8.09 20.24,13.66 17.50,6.14" fill="#a85573"/>
    <!-- Caixa central: o produto em estoque -->
    <rect x="19.5" y="19.5" width="9" height="9" rx="2" fill="#a85573"
          transform="rotate(45 24 24)"/>
</svg>
